services:
  # ----------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------
  - type: web
    name: curapulse-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

staticSites:
  # ----------------------------------------------------
  # Frontend Static Site
  # ----------------------------------------------------
  - name: curapulse-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://curapulse-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
